# Lint + build on every PR/push. The Pages deploy job stays until Vercel
# cutover so the last github.io publish is retained; upload is skipped
# when this app does not produce out/ (no static export).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_pages_artifact: ${{ steps.pages_check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - id: pages_check
        run: |
          if [ -d out ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No out/ directory (this app is not a static export). Skipping Pages upload so the last github.io deploy stays live until Vercel cutover."
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && steps.pages_check.outputs.present == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && steps.pages_check.outputs.present == 'true'
        with:
          path: out

  # Keep this job in the file until Vercel cutover. It no-ops unless
  # build uploaded an out/ artifact (this app does not emit one).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.has_pages_artifact == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
